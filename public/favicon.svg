<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- E—M: initials joined by an em dash (the typographic measure) -->
  <rect width="64" height="64" fill="#0a0a0a"/>
  <g fill="#ffffff" font-family="Satoshi, Helvetica, Arial, sans-serif" font-weight="900" font-size="26">
    <text x="8" y="42">E</text>
    <rect x="26" y="31" width="12" height="3.2"/>
    <text x="41" y="42">M</text>
  </g>
</svg>
